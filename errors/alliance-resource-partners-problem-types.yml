note: >-
  Not RFC 9457. The API returns application/json with the WordPress REST error envelope
  {code, message, data:{status, params?, details?}}. Every entry below was captured from a live anonymous
  request against www.arlp.com; none is inferred. ARLP publishes no error reference of its own.
envelope:
  content_type: application/json
  fields:
    code: Machine-readable error slug.
    message: Human-readable message.
    data.status: HTTP status, repeated in the body.
    data.params: Per-parameter validation messages (rest_invalid_param only).
    data.details: Per-parameter structured detail (rest_invalid_param only).
