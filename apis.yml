description: >-
  Alliance Resource Partners, L.P. (NASDAQ: ARLP) is a diversified energy and natural-resource partnership
  headquartered in Tulsa, Oklahoma. It is the largest coal producer in the eastern United States, operating
  underground and surface mines across the Illinois Basin and Appalachia, and it holds an oil and gas
  mineral and royalty portfolio alongside a growth-investment arm covering other energy and
  infrastructure ventures. ARLP runs no developer program: it publishes no API documentation, no OpenAPI,
  no SDK, no API pricing and no developer portal, and the api.arlp.com and developer.arlp.com hosts once
  listed here do not resolve in DNS. The only machine-readable interface the company serves is the
  read-only WordPress REST API behind its corporate site at www.arlp.com, which returns ARLP's own
  published corporate content - business segments, sustainability posture, careers, contact and legal
  pages, media, taxonomy and cross-content search - anonymously as JSON. Any operational data exchange with
  ARLP (customer contracts, rail and barge logistics, mine reporting, royalty statements) is a bilateral
  commercial agreement, not a published API product.
