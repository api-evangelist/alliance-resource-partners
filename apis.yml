      Careers, Contact, Privacy Statement, Terms of Use), the media library, blog posts and comments, the
      category and tag taxonomies, cross-content search, and self-describing type/taxonomy/status discovery
      endpoints. This is a corporate-content API, not a coal, logistics or royalty API. The OpenAPI below is
      DERIVED by API Evangelist from ARLP's own live route discovery document at https://www.arlp.com/wp-json/
