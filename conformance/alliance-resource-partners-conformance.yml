note: >-
  Cross-cutting standards the reachable Alliance Resource Partners surface does and does not conform to.
  ARLP publishes no compliance program, no certifications and no trust center, so no Compliance pointer is
  emitted. Domain-standard conformance is recorded as not-applicable rather than false: coal production and
  oil-and-gas mineral royalties have no API interchange standard that a corporate content API could declare,
  and the reward-only rule means an absent standard is not a penalty.
