domain_standard:
  applicable: false
  sector: Coal production, oil and gas mineral royalties, energy
  detail: >-
    ARLP's markets (thermal and metallurgical coal supply, oil and gas mineral and royalty interests) move on
    bilateral contracts, rail and barge logistics paperwork and SEC filings, not on a machine-readable API
    interchange standard. There is no SCIM, OData, OpenRTB, FHIR, ISO 20022, X12 or comparable domain schema
    that a corporate content API could declare, so none is claimed. The one interchange standard adjacent to
    ARLP's business - ANSI X12 EDI for customer and logistics documents - is not exposed on any public
    endpoint and is not asserted here.
compliance:
  program_published: false
  certifications: []
  detail: >-
    No trust center, no SOC 2 / ISO 27001 / PCI / HIPAA / FedRAMP claim, and no compliance page on arlp.com.
    ARLP's public regulatory disclosure is SEC filings and MSHA mine-safety reporting, neither of which is an
    information-security certification.
