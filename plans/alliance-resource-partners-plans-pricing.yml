description: >-
  Alliance Resource Partners, L.P. publishes no API plans and no API pricing of any kind. The company's
  entire public web presence is 12 pages (enumerated live from its own API at
  https://www.arlp.com/wp-json/wp/v2/pages and captured at examples/alliance-resource-partners-pages.json);
  none of them is a pricing, plans, developer or signup page. The one machine-readable surface ARLP serves -
  the read-only WordPress REST API behind www.arlp.com - is free, anonymous and unmetered, with no
  registration, no key and no commercial tier attached to it. Any data integration with ARLP (customer
  contracts, rail and barge logistics, royalty reporting) is a bilateral commercial agreement negotiated
  directly, not a published API product.
notes: >-
  Rewritten 2026-09-01. This file previously carried a placeholder "Customer / Partner Agreement" plan
  written by the 2026-05-04 bulk sweep. That plan was never published by ARLP and has been removed: an
  honest plan_count of 0 is the correct measurement, and a shell plan read as a commercial offering the
  company does not make.
